<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MGTR Business Hub | سامانه هوشمند رزرو و دعوت دیجیتال VIP</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap');

        :root {
            --primary: #8E2430;
            --gold: #C5A15B;
            --dark: #121212;
            --card-bg: #1a1a1a;
            --light: #F7F3EA;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            background-color: var(--dark);
            color: var(--light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-image: radial-gradient(circle at center, #2a2218 0%, #121212 100%);
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            color: var(--gold);
            font-size: 2.2rem;
            font-weight: 900;
            margin-bottom: 5px;
            text-shadow: 0 2px 10px rgba(197, 161, 91, 0.4);
        }

        header p {
            color: #aaa;
            font-size: 0.9rem;
        }

        .main-container {
            max-width: 650px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 2px solid rgba(197, 161, 91, 0.4);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.7);
        }

        .card h2 {
            color: var(--gold);
            font-size: 1.25rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #ccc;
            margin-bottom: 6px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            background: #111;
            border: 1px solid #333;
            border-radius: 10px;
            color: #fff;
            font-size: 0.95rem;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--gold);
            outline: none;
            box-shadow: 0 0 10px rgba(197, 161, 91, 0.3);
        }

        .btn {
            background: linear-gradient(135deg, var(--gold), #9a7836);
            color: #121212;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 900;
            width: 100%;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 5px 15px rgba(197, 161, 91, 0.3);
        }

        .btn:hover {
            transform: scale(1.01);
            box-shadow: 0 8px 25px rgba(197, 161, 91, 0.5);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status-box {
            margin-top: 15px;
            padding: 15px;
            border-radius: 10px;
            font-size: 0.9rem;
            display: none;
            text-align: center;
            line-height: 1.6;
        }

        .success {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid #22c55e;
            color: #4ade80;
        }

        .footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #777;
            text-align: center;
        }

        .footer span {
            color: var(--gold);
            font-weight: 700;
        }
    </style>
</head>
<body>

    <header>
        <h1>MGTR Business Hub 🏛️🚀</h1>
        <p>سیستم هوشمند ثبت‌نام، کارت دعوت دیجیتال و اتصال مستقیم به اکسل آنلاین</p>
    </header>

    <div class="main-container">
        <div class="card">
            <h2>📝 ثبت سفارش مشتری / رزرو نوبت VIP</h2>
            <div class="form-group">
                <label>نام و نام خانوادگی:</label>
                <input type="text" id="client-name" placeholder="مثلاً: سارا رضایی">
            </div>
            <div class="form-group">
                <label>شماره تماس:</label>
                <input type="text" id="client-phone" placeholder="مثلاً: 09151234567">
            </div>
            <div class="form-group">
                <label>نوع خدمت یا محصول:</label>
                <select id="client-service">
                    <option value="کارت دعوت دیجیتال VIP عروسی (۱ میلیون تومان)">💍 کارت دعوت دیجیتال VIP عروسی (۱ میلیون تومان)</option>
                    <option value="سامانه رزرو آنلاین آرایشگاه (۱.۵ میلیون تومان)">✂️ سامانه رزرو آنلاین آرایشگاه (۱.۵ میلیون تومان)</option>
                    <option value="سیستم مدیریت املاک KOROSH CRM (۵ میلیون تومان)">🏢 سیستم مدیریت املاک KOROSH CRM</option>
                </select>
            </div>
            <button class="btn" id="submit-btn" onclick="submitOrder()">ثبت نهایی و ارسال مستقیم به اکسل ⚡</button>
            <div id="status-box" class="status-box"></div>
        </div>
    </div>

    <div class="footer">
        توسعه یافته با قدرت توسط <span>MGTR Web Studio</span> | گام به گام تا خرید PS5 💪🔥
    </div>

    <script>
        // لینک جدید Version 2 گوگل شیت امیرحسین
        const GOOGLE_SHEET_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxijCdVt_QbbT5EsuSQ1XFjjBp2MEmqbuMgXtX31pVm7AIbhD1SFdmVX2oPpB8CESFE/exec";

        async function submitOrder() {
            const name = document.getElementById('client-name').value.trim();
            const phone = document.getElementById('client-phone').value.trim();
            const service = document.getElementById('client-service').value;
            const statusBox = document.getElementById('status-box');
            const submitBtn = document.getElementById('submit-btn');

            if(!name || !phone) {
                alert('لطفاً نام و شماره تماس رو کامل وارد کن رفیق!');
                return;
            }

            submitBtn.disabled = true;
            statusBox.style.display = 'block';
            statusBox.className = 'status-box success';
            statusBox.innerHTML = '⏳ در حال ارسال مستقیم اطلاعات به فایل اکسل آنلاین شما...';

            try {
                // ارسال استاندارد با فرمت فرم (۱۰۰٪ سازگار با Version 2)
                const formData = new URLSearchParams();
                formData.append('name', name);
                formData.append('phone', phone);
                formData.append('service', service);

                await fetch(GOOGLE_SHEET_WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: formData
                });

                statusBox.innerHTML = `✅ <strong>سفارش «${name}» با موفقیت ارسال شد!</strong><br>📊 الان فایل Google Sheet خودت رو چک کن؛ ردیف جدید نشست! 🎉`;
                
                document.getElementById('client-name').value = '';
                document.getElementById('client-phone').value = '';
                submitBtn.disabled = false;

            } catch (error) {
                statusBox.className = 'status-box';
                statusBox.style.background = 'rgba(142, 36, 48, 0.2)';
                statusBox.style.border = '1px solid #8E2430';
                statusBox.style.color = '#ff6b6b';
                statusBox.innerHTML = '❌ خطا در ارسال اطلاعات. لطفاً اتصال اینترنت را بررسی کنید.';
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
